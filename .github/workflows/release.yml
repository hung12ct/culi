name: Release assets

# Attaches prebuilt binaries + checksums.txt to a GitHub release, so users can
# install without a Go toolchain (see install.sh). Runs when a release is
# published; run it by hand to backfill a release whose tag contains
# scripts/dist.sh.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build assets for (e.g. v0.7.1)
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        run: sh scripts/dist.sh "$TAG"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
