<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>culi · Context Control</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('culi-theme');
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">

    <!-- STATUS STRIP -->
    <div class="strip" id="strip">
      <div class="strip-serve">
        <span class="dot dot-serve" id="serve-dot"></span>
        <span class="strip-serve-name">culi</span> local
        <span class="strip-version" id="s-version" title="Running Culi version">—</span>
      </div>
      <span class="strip-sep">·</span>
      <span><b id="s-cards">—</b> cards</span>
      <span class="strip-sep">·</span>
      <span>saved <b class="teal" id="s-saved">—</b> <span class="faint">(7d)</span></span>
      <span class="strip-sep">·</span>
      <span><b class="amber" id="s-review">—</b> to review</span>
      <span class="strip-sep">·</span>
      <span title="queued transcripts waiting to be mined"><b id="s-learn">—</b> to learn</span>
      <button class="strip-failed" id="s-failed" hidden><span>⚠</span> <span id="s-failed-label"></span></button>
      <div class="spacer"></div>
      <span class="faint strip-privacy">Private on this device</span>
    </div>

    <div class="body">

      <!-- LEFT NAV -->
      <nav class="nav">
        <div class="brand">
          <img class="brand-logo" src="logo.png" alt="culi" />
          <div>
            <div class="brand-title">culi</div>
            <div class="brand-sub">context control</div>
          </div>
        </div>
        <div class="nav-items" id="nav-items"></div>
        <div class="spacer"></div>
        <div class="spend">
          <div class="spend-head"><span>spend today</span><span class="mono" id="spend-amt">—</span></div>
          <div class="bar"><div class="bar-fill" id="spend-fill" style="width:0%"></div></div>
          <div class="spend-cap" id="spend-cap"></div>
        </div>
      </nav>

      <!-- MAIN -->
      <main class="main">
        <header class="header">
          <button class="header-back" id="screen-back" data-act="back" hidden></button>
          <h1 class="header-title" id="screen-title"></h1>
          <span class="header-sub" id="screen-sub"></span>
          <div class="spacer"></div>
          <div class="header-actions">
            <button class="hbtn theme-toggle" id="theme-toggle" data-act="toggleTheme" title="Use dark mode" aria-label="Use dark mode">
              <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
              <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
            </button>
            <button class="hbtn" data-act="refresh" title="Refresh data" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button>
            <button class="hbtn" data-act="shortcuts" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.3 2.08c-.75.38-1.1.9-1.1 1.92"/><path d="M12 17h.01"/></svg></button>
          </div>
        </header>
        <div class="screen" id="screen"></div>
      </main>
    </div>

    <!-- MODAL ROOT (repos manager, etc.) -->
    <div id="modal-root"></div>

    <!-- SHORTCUTS POPOVER -->
    <div class="shortcuts" id="shortcuts" hidden>
      <div class="shortcuts-title">Keyboard shortcuts</div>
      <div class="shortcuts-group">Review queue</div>
      <div class="shortcuts-row"><span><b class="mono">a</b> approve</span><span><b class="mono">r</b> reject</span></div>
      <div class="shortcuts-row"><span><b class="mono">s</b> skip</span><span><b class="mono">e</b> open editor</span></div>
      <div class="shortcuts-row"><span><b class="mono">j</b> / <b class="mono">k</b> move</span><span><b class="mono">⌘Z</b> undo</span></div>
      <div class="shortcuts-group">Anywhere</div>
      <div class="shortcuts-row"><span><b class="mono">?</b> this panel</span><span><b class="mono">Esc</b> close</span></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast" hidden>
      <span class="dot" id="toast-dot"></span>
      <span id="toast-msg"></span>
      <button class="toast-undo" id="toast-undo">Undo</button>
      <span class="mono keycap">⌘Z</span>
    </div>
  </div>

  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
